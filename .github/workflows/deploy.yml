name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  # Cada noche: refresca tarifas y stock de merchandising y vuelve a publicar.
  # GitHub usa UTC: 02:17 UTC = 03:17 en Madrid en invierno (CET) y 04:17 en verano (CEST).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Tarifas y stock del día desde seritene.com (/api/gor) → public/sites/seritene/shop-data/merch-pricing.json.
      # Si producción falla, el script conserva el archivo del repositorio y termina bien; el archivo nuevo
      # no se commitea: solo lo usa esta build.
      - name: Refresh merchandising prices and stock
        run: node scripts/refresh-merch-pricing.mjs
        env:
          # Parte de los precios ya publicados si son más recientes que los del repositorio.
          SEED_URL: ${{ steps.pages.outputs.base_url }}/sites/seritene/shop-data/merch-pricing.json
          # El script guarda lo obtenido antes de que se agote el tiempo del paso.
          REFRESH_BUDGET_MS: "1440000"
        timeout-minutes: 30
        continue-on-error: true

      - name: Build static site
        run: npm run build
        env:
          # "/imprent" en retuertographic.github.io/imprent; vacío con dominio propio.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
